<svg width="900" height="660" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ryder profile card">
<style>
@import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&amp;family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&amp;display=swap');
.blackletter{font-family:'UnifrakturCook',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.dim{fill:#4d4d54;}
.mid{fill:#8b8b93;}
.txt{fill:#ececef;}
.pink{fill:#F72585;}
.purple{fill:#A855F7;}
</style>

<defs>
  <clipPath id="cardClip">
    <rect x="0" y="0" width="900" height="660" rx="18"/>
  </clipPath>

  <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.05"/>
  </pattern>

  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="edgeFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F72585" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </linearGradient>
</defs>

<g clip-path="url(#cardClip)">

